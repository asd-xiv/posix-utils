name: Code QA
on:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    name: Lint (${{ matrix.image }})
    runs-on: ubuntu-latest
    # The shellcheck and the /bin/sh of the image check the scripts
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        image:
          - alpine:3.22
          - debian:trixie-slim
          - archlinux:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # get-youtube-transcript needs jq and curl to reach its flag check
      - name: Install the tools of the lint script
        run: bin/cli/omnipack --refresh shellcheck jq curl

      - name: Run linting
        run: tools/verify ./bin ./tools

  unit-test:
    name: Unit Test (${{ matrix.image }})
    runs-on: ubuntu-latest
    # The /bin/sh of the image runs the test files: BusyBox ash, dash, bash
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        image:
          - alpine:3.22
          - debian:trixie-slim
          - archlinux:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install the tools of the test files
        run: bin/cli/omnipack --refresh jq curl

      - name: Run unit tests
        run: tools/test
