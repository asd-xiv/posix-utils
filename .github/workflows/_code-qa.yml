name: Code QA
on:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    name: Lint (${{ matrix.image }})
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        image:
          - alpine:3.22
          - debian:trixie-slim
          - archlinux:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install dependencies
        env:
          SHELLCHECK_VERSION: 0.11.0
        run: bin/cli/omnipack --refresh shellcheck jq curl

      - name: Run linting
        run: tools/verify ./bin ./tools

  unit-test:
    name: Unit Test (${{ matrix.image }})
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        image:
          - alpine:3.22
          - debian:trixie-slim
          - archlinux:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install dependencies
        run: bin/cli/omnipack --refresh jq curl

      - name: Run unit tests
        run: tools/test
